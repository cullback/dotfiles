# https://blog.gitbutler.com/how-git-core-devs-configure-git/
# verify parsed correctly with
# git config --list --show-origin

[user]
email = "cullback@fastmail.com"
name = "cullback"
username = "cullback"

[init]
defaultBranch = "main"

[interactive]
diffFilter = "delta --color-only"

[delta]
navigate = true # n / N to jump between files & hunks
line-numbers = true
hyperlinks = true # clickable file:line in supporting terminals
# side-by-side is opt-in, not default: it TRUNCATES long lines and cannot be
# made to wrap — not by --wrap-max-lines unlimited, not by --max-line-length 0,
# and not by a wider terminal (a 1096-char line still renders to 85 chars at
# --width 300). Unified mode emits the whole line and lets less wrap it. The
# difference is silent: a long line shows as changed with the actual edit off
# the right edge. Bites hardest on one-row-per-record CSVs, where a 500-1000
# char field is normal. Opt in per command: git -c delta.features=sbs diff
syntax-theme = "Catppuccin Mocha"
file-style = "bold syntax"
file-decoration-style = "#585b70 ul"
hunk-header-style = "file line-number syntax"
hunk-header-decoration-style = "#585b70 box"
line-numbers-minus-style = "#f38ba8"
line-numbers-plus-style = "#a6e3a1"
line-numbers-zero-style = "#585b70"
zero-style = "syntax"
minus-style = "syntax #45293a"
plus-style = "syntax #2a3a2a"

# dotted form instead of [delta "sbs"]: git treats them the same for a
# lowercase subsection, and the TOML formatter only accepts this one
[delta.sbs]
side-by-side = true

[merge]
conflictStyle = "zdiff3"

[core]
editor = "hx"
pager = "delta"
hooksPath = "~/.config/git/hooks"

[column]
ui = "auto"

[branch]
sort = "-committerdate"

[tag]
sort = "version:refname"

[diff]
algorithm = "histogram"
colorMoved = "plain"
mnemonicPrefix = true
renames = true

[push]
default = "simple"
autoSetupRemote = true
followTags = true

[fetch]
prune = true
pruneTags = true
all = true
